name: R runtime quality gates

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "r_engine/**"
      - "backend/modules/text_research/infrastructure/r_runtime/**"
      - "backend/modules/text_research/infrastructure/engines/r_engine.py"
      - "backend/modules/text_research/tests/parity/**"
      - "backend/modules/text_research/application/engine_comparison.py"
      - ".github/workflows/quanteda-parity.yml"
  push:
    branches: [main, master]
    paths:
      - "r_engine/**"
      - "backend/modules/text_research/infrastructure/r_runtime/**"
      - "backend/modules/text_research/infrastructure/engines/r_engine.py"
      - "backend/modules/text_research/tests/parity/**"
      - "backend/modules/text_research/application/engine_comparison.py"
      - ".github/workflows/quanteda-parity.yml"

jobs:
  quanteda-parity:
    runs-on: ubuntu-latest
    container:
      # Keep in lockstep with r_engine/Dockerfile and renv.lock (R 4.4.0).
      image: rocker/r-ver:4.4.0
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python + locked deps
        run: |
          apt-get update
          apt-get install -y curl python3 python3-venv
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --frozen --extra dev

      - name: Restore locked R dependencies
        run: |
          Rscript -e 'install.packages("renv", repos="https://cloud.r-project.org")'
          Rscript -e 'renv::restore(project = "../r_engine", prompt = FALSE)'

      - name: R testthat contracts
        working-directory: r_engine
        run: Rscript -e 'renv::load("."); testthat::test_dir("tests/testthat")'

      - name: Run cross-runtime parity tests
        env:
          RESEARCH_R_ENABLED: "true"
          RESEARCH_R_ENGINE_ENTRYPOINT: ../r_engine/run_analysis.R
          PYTHONPATH: ..
        run: |
          . .venv/bin/activate
          python -m pytest modules/text_research/tests/parity/test_r_parity.py -q
