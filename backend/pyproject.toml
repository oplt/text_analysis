[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "app-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "celery",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "redis",
    "pydantic-settings",
    "pyjwt",
    "passlib[argon2]",
    "python-multipart",
    "email-validator",
    "httpx",
    "aiosmtplib",
    "pyotp",
    "boto3",
    "sentry-sdk[fastapi]",
    "prometheus-client",
    "prometheus-fastapi-instrumentator",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-sqlalchemy",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-exporter-otlp-proto-grpc",
    "mem0ai",
    "langchain-text-splitters",
    "pypdf",
    "python-docx",
    "pgvector",
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "scikit-learn",
    "joblib",
    "snowballstemmer",
    "regex",
    "ftfy",
    "simplemma",
    "statsmodels",
]

[project.optional-dependencies]
# pip install -e ".[dev]" (CI / local). Keep in sync with [dependency-groups].dev.
dev = [
    "honcho>=2.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.11.2",
]
nlp = ["spacy>=3.7"]
pdf = ["pymupdf>=1.24"]
bertopic = ["bertopic", "umap-learn", "hdbscan"]
transformers = ["torch", "transformers"]

[project.scripts]
text-research = "backend.modules.text_research.cli:main"

# Editable install lives in backend/, but import root is the repo package `backend.*`
# (not sibling top-level api/core/db/...). Discover from parent so semantics stay clear.
[tool.setuptools.package-dir]
"" = ".."

[tool.setuptools.packages.find]
where = [".."]
include = ["backend*"]
exclude = [
    "backend.alembic*",
    "backend.tests*",
    "backend.logs*",
    "backend.scripts*",
    "backend.*.tests*",
    "backend.modules.*.tests*",
    "backend.modules.*.*.tests*",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"alembic/env.py" = ["E402"]

[dependency-groups]
dev = [
    "honcho>=2.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.11.2",
]

# Deterministic installs: commit uv.lock; CI uses `uv sync --frozen --extra dev`.
[tool.uv]
package = true

[tool.pytest.ini_options]
faulthandler_timeout = 30
