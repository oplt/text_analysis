version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: app_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set in infra/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: app_redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: app_mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  minio:
    image: minio/minio:latest
    container_name: app_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in infra/.env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  # Optional dedicated R Celery worker (Python orchestration + pinned R/quanteda).
  # Build from repo root: docker compose -f infra/docker-compose.yml build worker-r
  worker-r:
    profiles: ["r"]
    build:
      context: ..
      dockerfile: r_engine/Dockerfile
    image: text-analysis-r-worker:local
    container_name: app_worker_r
    environment:
      RESEARCH_R_ENABLED: "true"
      RESEARCH_RSCRIPT_PATH: Rscript
      RESEARCH_R_ENGINE_ENTRYPOINT: /opt/r_engine/run_analysis.R
      RESEARCH_QUEUE_R: research_r
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set in infra/.env}:${POSTGRES_PASSWORD:?set in infra/.env}@postgres:5432/${POSTGRES_DB:?set in infra/.env}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
